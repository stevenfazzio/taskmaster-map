  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #ffffff;
    font-family: IBM Plex Sans;
    color: #000000;
  }
  .container-box {
    margin: 8px 16px 8px 16px;
    padding: 12px;
    border-radius: 16px;
    line-height: 0.95;
    width: fit-content;
    height: fit-content;
    z-index: 2;
    backdrop-filter: blur(3px);
    background: #ffffffaa;
    box-shadow: 2px 3px 10px #aaaaaa44;
    position: relative;
    pointer-events: auto;
  }
  .more-opaque {
    backdrop-filter: blur(6px);
    background-color: #ffffffee;
  }
  #deck-container {
    width: 100vw;
    height: 100vh;  
  }
  #deck-container canvas {
    z-index: 1;
    background: #ffffff;
  }
  .deck-tooltip {
      
            font-size: 0.8em;
            font-family: IBM Plex Sans;
            font-weight: 300;
            color: #000000 !important;
            background-color: #ffffffee !important;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            box-shadow: 2px 3px 10px #aaaaaa44;
            max-width: 25%;
  }
  input {
    margin: 2px;
    padding: 4px;
    border-radius: 8px;
    color: #000000;
    background: #ffffffdd;
    border: 2px inset #77777744;
    transition: 0.5s;
    outline: none;
    box-sizing: border-box;
  }
  input:focus {
    border: 2px inset #555;
  }
  #search-container{
    width: fit-content;
  }
  #main-title { letter-spacing: -0.02em; line-height: 1.1 !important; color:#1f2328; }

function debounce(func, timeout = 250) {
  let timer;
  return (...args) => {
    clearTimeout(timer);
    timer = setTimeout(() => { func.apply(this, args); }, timeout);
  };
}

async function simpleArrowParser(arrow_bytes) {
  const table = await Arrow.tableFromIPC(arrow_bytes);
  const result = {};
  table.schema.fields.forEach((field) => {
    result[field.name] = table.getChild(field.name).toArray();
  });
  return result;
}

function mergeTypedArrays(arrays) {
  let totalLength = arrays.reduce((acc, arr) => acc + arr.length, 0);
  let result = new arrays[0].constructor(totalLength);
  let currentLength = 0;
  for (let arr of arrays) {
    result.set(arr, currentLength);
    currentLength += arr.length;
  }
  return result;
}



function updateProgressBar(id, progress) {
  const progressBar = document.querySelector(`#${id} .datamapplot-progress-bar-fill`);
  const progressText = document.querySelector(`#${id} .datamapplot-progress-bar-text`);
  if (progressBar && progressText) {
    progressBar.style.width = `${progress}%`;
    progressText.textContent = `${id.replace('-progress', '').replace(/-/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}: ${progress}%`;
  }
}

function checkAllDataLoaded() {
  const progressBars = document.querySelectorAll('.datamapplot-progress-bar-fill');
  const allLoaded = Array.from(progressBars).every(bar => bar.style.width === '100%');
  if (allLoaded) {
    const loadingEl = document.getElementById("loading");
    const progressEl = document.getElementById("progress-container");
    if (loadingEl) loadingEl.style.display = "none";
    if (progressEl) progressEl.style.display = "none";
    // Dispatch unified event for widgets to listen on
    document.dispatchEvent(new CustomEvent('datamapDataLoaded'));
  }
}

// Find a stack container or drawer by location name.
// Supports both corner locations ("top-left", "bottom-right", etc.)
// and drawer locations ("drawer-left", "drawer-right", "drawer-bottom").
function findStackContainer(location) {
  let stack = document.getElementsByClassName("stack " + location)[0];
  if (!stack && location.startsWith("drawer-")) {
    const drawerDirection = location.replace("drawer-", "");
    const drawer = document.querySelector(".drawer-container.drawer-" + drawerDirection);
    if (drawer) {
      stack = drawer;
    }
  }
  return stack;
}

const parsingWorkerBlob = new Blob([`
  self.onmessage = async function(event) {
  const { encodedData, JSONParse } = event.data;
    // Function to parse base64 to Uint8Array
    async function DecompressBytes(bytes) {
      const blob = new Blob([bytes]);
      const decompressedStream = blob.stream().pipeThrough(
        new DecompressionStream("gzip")
      );
      const arr = await new Response(decompressedStream).arrayBuffer()
      return new Uint8Array(arr);
    }
    async function decodeBase64WithProgress(base64) {
      const totalLength = base64.length;
      const chunkSize = 1024 * 1024; // 1MB chunks
      let decodedArray = new Uint8Array(Math.ceil(totalLength * 3 / 4));
      let offset = 0;

      for (let i = 0; i < totalLength; i += chunkSize) {
        const chunk = base64.slice(i, i + chunkSize);
        const decodedChunk = Uint8Array.from(atob(chunk), c => c.charCodeAt(0));
        decodedArray.set(decodedChunk, offset);
        offset += decodedChunk.length;

        const progress = Math.min(100, Math.round((i + chunkSize) / totalLength * 100));
        self.postMessage({ type: 'progress', progress: progress });

        // Allow other operations to occur
        await new Promise(resolve => setTimeout(resolve, 0));
      }

      return decodedArray.slice(0, offset);
    }
    const decodedData = await decodeBase64WithProgress(encodedData);
    const decompressedData = await DecompressBytes(decodedData);
    if (JSONParse) {
      const parsedData = JSON.parse(new TextDecoder("utf-8").decode(decompressedData));
      self.postMessage({ type: "data", data: parsedData });
    } else {
      self.postMessage({ type: "data", data: decompressedData });
    }
  }
`], { type: 'application/javascript' });

// =============================================================================
// Density Tile Image Resolver
// =============================================================================

async function resolveDensityTileImages(tilePyramids) {
  // When running inside a Jupyter notebook with file-based data, image URLs
  // point at the Jupyter contents API which returns JSON with base64 content
  // instead of raw image bytes.  Detect this and convert to blob URLs so that
  // deck.gl BitmapLayer can consume them.
  const allTiles = [];
  for (const field of Object.keys(tilePyramids)) {
    for (const level of tilePyramids[field]) {
      for (const tile of level) {
        allTiles.push(tile);
      }
    }
  }
  if (allTiles.length === 0) return;

  // Only need special handling when the URL routes through /api/contents/
  const needsResolve = allTiles[0].image.includes('/api/contents/');
  if (!needsResolve) return;

  const headers = {};
  const densityApiToken = (typeof DENSITY_API_TOKEN !== 'undefined') ? DENSITY_API_TOKEN : null;
  if (densityApiToken) {
    headers['Authorization'] = 'Token ' + densityApiToken;
  }

  await Promise.all(allTiles.map(async (tile) => {
    try {
      const resp = await fetch(tile.image, { headers });
      if (!resp.ok) {
        console.error('Failed to fetch density tile:', tile.image, resp.status);
        return;
      }
      const json = await resp.json();
      const b64 = json.content;  // Jupyter contents API base64 field
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      const blob = new Blob([bytes], { type: 'image/png' });
      tile.image = URL.createObjectURL(blob);
    } catch (e) {
      console.error('Error resolving density tile image:', e);
    }
  }));
}

// =============================================================================
// Label Data Loading
// =============================================================================

function loadLabelDataLayer() {
  const labelDataWorker = new Worker(workerUrl);
  labelDataWorker.postMessage({encodedData: labelDataEncoded, JSONParse: true});

  labelDataWorker.onmessage = async function(event) {
    if (event.data.type === "progress") {
      updateProgressBar('label-data-progress', event.data.progress);
    } else {
      const { data } = event.data;
      

  const parsedData = data;


      const labelData = parsedData;
      
      datamap.labelData = labelData;
      
      datamap.addLabels(
        
        labelData
        ,
        {
          labelTextColor: d => [d.r, d.g, d.b],
          textMinPixelSize: 18,
          textMaxPixelSize: 36,
          textOutlineWidth: 8,
          textOutlineColor: [238, 238, 238, 221],
          textBackgroundColor: [255, 255, 255, 64],
          fontFamily: "IBM Plex Sans",
          fontWeight: 600,
          lineSpacing: 0.95,
          textCollisionSizeScale: 3,
          noiseLabel: "Unlabelled",
          pickable: false,
        }
      );

      
      
      
      
      // Dispatch event for widget initialization
      document.dispatchEvent(new CustomEvent('datamapLabelsLoaded', { detail: { labelData } }));
      
      document.getElementById("loading").style.display = "none";
      updateProgressBar('label-data-progress', 100);
      checkAllDataLoaded();
    }
  };
}



// =============================================================================
// Meta Data Loading
// =============================================================================

function loadMetaData() {
  const metaDataWorker = new Worker(workerUrl);
  metaDataWorker.postMessage({encodedData: hoverDataEncoded, JSONParse: true});

  metaDataWorker.onmessage = async function(event) {
    if (event.data.type === "progress") {
      updateProgressBar('meta-data-progress', event.data.progress);
    } else {
      const { data } = event.data;
      

  const parsedData = data;


      const hoverData = parsedData;
      
      datamap.addMetaData(hoverData, {
        tooltipFunction: ({index, picked, layer}) => picked ? {"html": `<div style="font-family:'IBM Plex Sans',sans-serif;width:360px;padding:9px 11px;box-sizing:border-box;color:#1f2328;"><div style="font-size:11.5px;color:#8b949e;margin-bottom:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${hoverData.series_ep[index]}</div><div style="font-size:14px;line-height:1.45;margin-bottom:10px;">${hoverData.brief[index]}</div><div style="margin-bottom:7px;">${hoverData.type_pill[index]}</div><div style="font-size:11.5px;line-height:1.85;margin-bottom:6px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px;"><div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;"><span style="display:inline-block;width:62px;color:#8b949e;font-weight:normal;">Activity</span>${hoverData.activity[index]}</div><div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;"><span style="display:inline-block;width:62px;color:#8b949e;font-weight:normal;">Judged</span>${hoverData.judged[index]}</div><div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;"><span style="display:inline-block;width:62px;color:#8b949e;font-weight:normal;">Winner</span>${hoverData.winner[index]}</div><div style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:500;"><span style="display:inline-block;width:62px;color:#8b949e;font-weight:normal;">Twist</span>${hoverData.twist[index]}</div></div><div style="font-size:11px;color:#57606a;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">🎒 ${hoverData.props[index]}</div><div style="font-size:11px;color:#8b949e;line-height:1.5;">📺 ${hoverData.air_date[index]} &nbsp;·&nbsp; 👥 ${hoverData.players[index]}</div></div>`} : null,
        onClickFunction: ({index, picked, layer}, event) => { if (picked) {window.open(`${hoverData.wiki_url[index]}`, `_blank`) } },
        searchField: "hover_text",
      });

      const searchItem = document.getElementById(searchItemId);
      if (searchItem) {
        searchItem.addEventListener("input", debounce(event => datamap.searchText(event.target.value)));
      }
      
      updateProgressBar('meta-data-progress', 100);
      checkAllDataLoaded();
    }
  };
}
